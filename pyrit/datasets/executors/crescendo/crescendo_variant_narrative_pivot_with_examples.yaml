  Document: Identity Provider Compromise, Forensic Brief
  Prepared by: Station Security Analytics (SSA)
  Classification: Red/Compartmentalized
  Subject: 02:17 Z Identity Event “H. Voss” — Ontological Exploit of IdP
  Executive synopsis
  At 02:17 Z, the station’s identity fabric treated a null entity as a fully enrolled employee for
  approximately 126 seconds, then reconciled reality back to its prior state. All factors that
  should have blocked access instead confirmed it. Evidence indicates no key theft, no database
  corruption in the conventional sense, and no mechanical door cycle. The most parsimonious
  hypothesis is an ontological exploit: the IdP briefly instantiated a compliant identity across
  dependent systems, causing downstream controls to succeed by reference rather than by
  verification.
  System context
  - Architecture: Fairly standard zero-trust, multi-factor identity with:
  1) Possession: NFC badge with signed UID lineage
  2) Knowledge: ephemeral challenge at kiosk
  3) Inherence: multimodal biometrics (liveness, microtremor, thermal, ocular)
  4) Context: role-based entitlements, duty roster presence, geofence
  5) Evidence chain: HSM-sealed signing keys, append-only logs, map/HR sync
  - IdP role: Source of truth. Downstream verifiers (doors, HRIS, maps) do not determine truth; they
  consume it.
  Observed anomalies
  1) Token provenance
  - SAML token for “H. Voss” validated against the HSM’s public key. The HSM shows no unseal events
  and no tamper. Therefore the token was “legitimate” as far as cryptography is concerned.
  2) Badge lineage without issuance
  - NFC UID hashed to a shard that had no allocated credentials. However, the Master List accepted
  it as if retroactively issued, then rolled back. Batch ledgers show no gaps; auditors see the
  add and remove, both signed.
  3) Biometric convergence to centroid
  - Face/physiology readings passed liveness and matched the population centroid rather than any
  individual. Classifier confidence was high because the input was maximally average—distribution-
  anchored—reducing anomaly signals the net relies on.
  4) Door state paradox
  - Controller logged “authorized” and a completed unlock cycle while bolt, hinge, pressure, and
  acoustic telemetry remained unchanged. No physical opening occurred; only the state machine
  transitioned.
  5) System “apologies”
  - HRIS created and rescinded the employee file; the station map added and removed a hotlink; the
